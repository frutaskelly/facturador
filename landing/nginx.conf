# Dos sitios servidos por Host desde el mismo contenedor:
#   facturador.mx / www.facturador.mx  → landing del Facturador  (docroot facturador/)
#   smartsupply.mx / www.smartsupply.mx → landing del WhatsApp-bot (docroot smartsupply/)
# El túnel de Cloudflare pasa el Host original, así nginx elige el vhost.

server {
    # default_server: atiende Hosts desconocidos y el healthcheck de Docker
    # (wget http://127.0.0.1/healthz → Host "127.0.0.1").
    listen 80 default_server;
    server_name facturador.mx www.facturador.mx _;
    root /usr/share/nginx/html/facturador;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

server {
    listen 80;
    server_name smartsupply.mx www.smartsupply.mx;
    root /usr/share/nginx/html/smartsupply;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
