# SmartSupply v2.0 — stack de PRODUCCIÓN.
#
# Imágenes autocontenidas (sin bind-mount del código) servidas a internet vía
# un Cloudflare Tunnel PROPIO (tunnel "smartsupplyv2", credenciales en
# cloudflared-config/, gitignored). Antes dependía del túnel compartido
# cadena_tunnel, cuya config vivía en una carpeta de OneDrive fuera de este
# repo — cuando OneDrive no la rematerializaba tras un reinicio, el túnel
# quedaba caído sin forma de auto-recuperarse. Ahora vive dentro del propio
# stack, con restart:unless-stopped como todo lo demás aquí. El backend usa
# la DB CLOUD de Supabase (no el postgres local). Levantar con:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Hostnames (ingress del túnel) — corren AMBOS dominios (facturador.mx primario,
# smartsupply.mx legado). El frontend deriva el API de su propio host (lib/api.ts).
#   facturador.mx / smartsupply.mx          → landing  (nginx)
#   app.facturador.mx / app.smartsupply.mx  → frontend (Next.js)
#   admin.facturador.mx / admin.smartsupply.mx → frontend (Next.js, middleware → /admin)
#   api.facturador.mx / api.smartsupply.mx  → backend  (FastAPI)
#
# Proyecto/red propios (smartsupplyv2prod) para no chocar con el stack de dev
# (smartsupplyv2) que comparte el host.
name: smartsupplyv2prod

services:
  redis:
    image: redis:7-alpine
    container_name: smartsupplyv2_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ssv2]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartsupplyv2-backend:prod
    container_name: smartsupplyv2_backend
    restart: unless-stopped
    # Secrets vienen del .env.prod (gitignored) — SEPARADO del .env de dev, que
    # apunta a Facturama sandbox. .env.prod trae las credenciales/flags de
    # producción (Facturama prod, ALLOW_PRODUCTION=true). Las claves de abajo lo
    # sobreescriben: DB en la nube, CORS de dominios reales, env=production.
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      # DATABASE_URL / DATABASE_URL_ASYNC vienen del .env.prod (gitignored):
      # pooler Supabase (Supavisor) session mode :5432 — IPv4. La conexión
      # directa db.<ref>.supabase.co:5432 es solo IPv6 y no es alcanzable desde
      # el contenedor. Usuario pooler = postgres.<project_ref>.
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "https://app.facturador.mx,https://admin.facturador.mx,https://facturador.mx,https://api.facturador.mx,https://app.smartsupply.mx,https://admin.smartsupply.mx,https://smartsupply.mx,https://api.smartsupply.mx"
    depends_on:
      redis:
        condition: service_healthy
    networks: [ssv2]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El front deriva el API de su propio host en runtime (lib/api.ts:apiBaseUrl),
        # así el mismo build sirve facturador.mx y smartsupply.mx. Esta env solo es
        # FALLBACK (SSR/localhost) — se deja en un dominio que ya resuelve.
        NEXT_PUBLIC_API_URL: https://api.smartsupply.mx
        NEXT_PUBLIC_SUPABASE_URL: https://qwffsaxoeehwwdzaytqb.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tgJ_GhSa9ZtHvysc-HPH1g_4V1bjKDb
    image: smartsupplyv2-frontend:prod
    container_name: smartsupplyv2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # El "/" redirige (307) a /dashboard; el healthcheck base espera 200, así
    # que apuntamos a /login (200) y aceptamos cualquier código < 400.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [ssv2]

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    image: smartsupplyv2-landing:prod
    container_name: smartsupplyv2_landing
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 explícito: el wget de busybox resuelve localhost a ::1 (IPv6)
      # y nginx solo escucha IPv4 → "connection refused" con localhost.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ssv2]

  tunnel:
    # Pineada (era :latest): el túnel es el único punto de entrada a prod; un
    # pull sorpresa con breaking change lo tumbaría. Subir la versión a propósito.
    image: cloudflare/cloudflared:2026.5.2
    container_name: smartsupplyv2_tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config:/etc/cloudflared:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_healthy
      landing:
        condition: service_healthy
    networks: [ssv2]

volumes:
  redisdata:
    driver: local

networks:
  ssv2:
    name: smartsupplyv2prod_network
