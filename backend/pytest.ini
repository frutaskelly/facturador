[pytest]
testpaths = tests
python_files = test_*.py
# -rs: la corrida DECLARA lo que se saltó. Sin esto, `pytest -q` imprime una
# fila de puntos y nada más: una corrida con 639 pasadas y otra con 108
# pasadas y 531 saltadas (la base de pruebas apagada) se ven IGUAL de verdes.
# La señal que delata el falso verde era justo la que no se imprimía.
addopts = -q -rs
filterwarnings =
    ignore::DeprecationWarning
